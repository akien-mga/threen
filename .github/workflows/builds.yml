name: Builds

on: [push, pull_request]

env:
  LIBNAME: threen
  API_VERSION: 4.3

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-macos
  cancel-in-progress: true

jobs:
  build:
    runs-on:  ${{matrix.os}}
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: windows-debug
            os: windows-latest
            name: 🏁 Windows Debug
            target: template_debug
            platform: windows
            arch: x86_64
          - identifier: windows-release
            os: windows-latest
            name: 🏁 Windows Release
            target: template_release
            platform: windows
            arch: x86_64
          - identifier: macos-debug
            os: macos-latest
            name: 🍎 macOS (universal) Debug
            target: template_debug
            platform: macos
            arch: universal
          - identifier: macos-release
            os: macos-latest
            name: 🍎 macOS (universal) Release
            target: template_release
            platform: macos
            arch: universal
          - identifier: linux-debug
            os: ubuntu-22.04
            name: 🐧 Linux Debug
            target: template_debug
            platform: linux
            arch: x86_64
          - identifier: linux-release
            os: ubuntu-22.04
            name: 🐧 Linux Release
            target: template_release
            platform: linux
            arch: x86_64
          - identifier: web-debug-threads
            os: ubuntu-latest
            name: 🌐 Web Debug (Threads)
            target: template_debug
            platform: web
            arch: wasm32
            suffix: .threads
            sconsargs: threads=yes
          - identifier: web-release-threads
            os: ubuntu-latest
            name: 🌐 Web Release (Threads)
            target: template_release
            platform: web
            arch: wasm32
            suffix: .threads
            sconsargs: threads=yes
          - identifier: web-debug-nothreads
            os: ubuntu-latest
            name: 🌐 Web Debug (No Threads)
            target: template_debug
            platform: web
            arch: wasm32
            suffix: .nothreads
            sconsargs: threads=no
          - identifier: web-release-nothreads
            os: ubuntu-latest
            name: 🌐 Web Release (No Threads)
            target: template_release
            platform: web
            arch: wasm32
            suffix: .nothreads
            sconsargs: threads=no


    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up SCons
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons
          scons --version

      - name: Linux dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config

      - name: Setup MinGW for Windows/MinGW build
        if: ${{ matrix.platform == 'windows' }}
        uses: egor-tensin/setup-mingw@v3
        with:
          version: 12.2.0

      - name: Web dependencies
        if: ${{ matrix.platform == 'web' }}
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.20

      - name: Compile godot-cpp
        shell: sh
        run: |
          scons api_version='${{ env.API_VERSION }}' target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' ${{ matrix.sconsargs }}
        working-directory: godot-cpp

      - name: Compile Extension
        shell: sh
        run: |
          scons api_version='${{ env.API_VERSION }}' target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' ${{ matrix.sconsargs }}

      - name: Delete compilation files
        if: ${{ matrix.platform == 'windows' }}
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: '${{ env.LIBNAME }}.${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}${{ matrix.suffix }}'
          path: 'bin/'

      - name: Archive Release
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: '${{ env.LIBNAME }}.${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}${{ matrix.suffix }}.zip'
          path: 'bin/'

      - name: Create and upload asset
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "${{ env.LIBNAME }}.${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}${{ matrix.suffix }}.zip"
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
